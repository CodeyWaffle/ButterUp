<script>
(()=>{
const $=id=>document.getElementById(id);
const MOB0=matchMedia('(pointer: coarse)').matches||/Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent);
const cv=$('c'),gl=cv.getContext('webgl',{antialias:!MOB0,alpha:false});
if(!gl){$('menu').innerHTML='<div class="card"><h1>😢</h1><p>This browser does not support WebGL.</p></div>';return;}
const R=3,N=64,M0=1000,GAME=60,MAXV=5,RC=R-.2,T=.5206;
/* ---------- shaders ---------- */
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o;}
const FS=`#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec3 vN,vW;
uniform vec3 uCol,uEm,uL,uE;uniform float uTex,uSp,uGl,uAl,uRim,uTi;uniform vec4 uHZ[3];uniform sampler2D uT;
void main(){vec3 n=normalize(vN),c=uCol,em=uEm;float a=0.;
if(uTex>.5&&n.y>.5){vec2 uv=vW.xz/6.+.5;float t=texture2D(uT,uv).r;float rt=t*4.;a=smoothstep(.04,.35,rt);
vec3 bc=mix(vec3(.5,.42,.2),vec3(1.,.9,.25),smoothstep(.4,1.,rt));
bc=mix(bc,vec3(1.,.58,.1),smoothstep(1.,1.7,rt));bc=mix(bc,vec3(.75,.2,.05),smoothstep(1.7,2.6,rt));
c=mix(c,bc,a);
float e=.016;vec2 gr=vec2(texture2D(uT,uv+vec2(e,0.)).r-texture2D(uT,uv-vec2(e,0.)).r,texture2D(uT,uv+vec2(0.,e)).r-texture2D(uT,uv-vec2(0.,e)).r);
n=normalize(n+vec3(-gr.x,0.,-gr.y)*5.*a);
for(int i=0;i<3;i++){float q=length(vW.xz-uHZ[i].xy),r=uHZ[i].z;float g=1.-smoothstep(r*.3,r,q);
float rg=1.-smoothstep(0.,.07,abs(q-r*.9));
em+=vec3(1.,.3,.04)*(g*(.4+.15*sin(uTi*4.+float(i)*2.))*(1.-.5*a)+rg*.45*uHZ[i].w);}}
vec3 L=uL-vW;float d=length(L);L/=d;float lit=dot(n,L);float df=max(lit,0.)/(1.+.012*d*d);
vec3 V=normalize(uE-vW),H=normalize(L+V);
float sp=pow(max(dot(n,H),0.),uGl)*(uSp+a*.5)*step(0.,lit);
float fr=pow(1.-max(dot(n,V),0.),2.5);
gl_FragColor=vec4(c*(vec3(.46,.4,.36)+df*2.*vec3(1.,.82,.6))+sp*vec3(1.,.9,.7)+em+uRim*fr*vec3(.9,.7,.25),uAl);}`;
function mkProg(vs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,FS));
gl.bindAttribLocation(p,0,'aP');gl.bindAttribLocation(p,1,'aN');gl.linkProgram(p);
if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw gl.getProgramInfoLog(p);
gl.useProgram(p);const U={};
['uVP','uPos','uSc','uSh','uPw','uTm','uVt','uCol','uEm','uL','uE','uTex','uSp','uGl','uT','uAl','uRim','uTi','uHZ'].forEach(n=>U[n]=gl.getUniformLocation(p,n));
gl.uniform1i(U.uT,0);gl.uniform3f(U.uL,-3,8,3);return{p,U};}
const PP=mkProg(`attribute vec3 aP,aN;uniform mat4 uVP;uniform vec3 uPos,uSc;varying vec3 vN,vW;
void main(){vec3 w=aP*uSc+uPos;vW=w;vN=aN;gl_Position=uVP*vec4(w,1.);}`);
/* soft-body shader: a superellipsoid (boxy stick -> blob as uPw drops) with melt sag, ripple and lean */
const PB=mkProg(`attribute vec3 aP;uniform mat4 uVP;uniform vec3 uPos,uSc;uniform vec2 uSh;uniform float uPw,uTm,uVt;varying vec3 vN,vW;
void main(){vec3 d=aP,a=abs(d);
float s=pow(pow(a.x,uPw)+pow(a.y,uPw)+pow(a.z,uPw),1./uPw);
vec3 p=d/s;vec3 n=normalize(sign(p)*pow(abs(p),vec3(uPw-1.)));
float low=1.-smoothstep(-1.,.5,p.y);
p.xz*=1.+uTm*.4*low;
p.y+=sin(uVt*7.+p.x*5.+p.z*4.)*uTm*.06*(.5+.5*p.y);
vec3 w=uPos+p*uSc;w.xz+=uSh*(p.y*.5+.5);
vW=w;vN=n;gl_Position=uVP*vec4(w,1.);}`);
let CP=PP;function use(q){CP=q;gl.useProgram(q.p);}
use(PP);gl.enableVertexAttribArray(0);gl.enableVertexAttribArray(1);
gl.enable(gl.DEPTH_TEST);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.clearColor(.17,.1,.06,1);
/* ---------- meshes (no culling, so winding never matters) ---------- */
function mesh(v){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(v),gl.STATIC_DRAW);return{b,n:v.length/6};}
function quad(v,a,b,c,d,n){[a,b,c,a,c,d].forEach(p=>v.push(...p,...n));}
const box=(()=>{const v=[],h=.5;
quad(v,[-h,h,-h],[-h,h,h],[h,h,h],[h,h,-h],[0,1,0]);
quad(v,[-h,-h,-h],[h,-h,-h],[h,-h,h],[-h,-h,h],[0,-1,0]);
quad(v,[-h,-h,h],[h,-h,h],[h,h,h],[-h,h,h],[0,0,1]);
quad(v,[-h,-h,-h],[-h,h,-h],[h,h,-h],[h,-h,-h],[0,0,-1]);
quad(v,[h,-h,-h],[h,h,-h],[h,h,h],[h,-h,h],[1,0,0]);
quad(v,[-h,-h,-h],[-h,-h,h],[-h,h,h],[-h,h,-h],[-1,0,0]);
return mesh(v);})();
function cyl(r0,r1){const v=[],S=48;for(let i=0;i<S;i++){
const a=i/S*6.28318,b=(i+1)/S*6.28318,ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),nx=(ca+cb)/2,nz=(sa+sb)/2;
quad(v,[r1*ca,0,r1*sa],[r1*cb,0,r1*sb],[r1*cb,1,r1*sb],[r1*ca,1,r1*sa],[nx,0,nz]);
if(r0>0)quad(v,[r0*ca,0,r0*sa],[r0*cb,0,r0*sb],[r0*cb,1,r0*sb],[r0*ca,1,r0*sa],[-nx,0,-nz]);
quad(v,[r0*ca,1,r0*sa],[r0*cb,1,r0*sb],[r1*cb,1,r1*sb],[r1*ca,1,r1*sa],[0,1,0]);}
return mesh(v);}
const cy=cyl(0,1),ring=cyl(1,1.0833);
function draw(m,p,s,col,o){o=o||{};const U=CP.U;gl.bindBuffer(gl.ARRAY_BUFFER,m.b);
gl.vertexAttribPointer(0,3,gl.FLOAT,false,24,0);gl.vertexAttribPointer(1,3,gl.FLOAT,false,24,12);
gl.uniform3fv(U.uPos,p);gl.uniform3fv(U.uSc,s);gl.uniform3fv(U.uCol,col);gl.uniform3fv(U.uEm,o.em||[0,0,0]);
gl.uniform1f(U.uTex,o.tex?1:0);gl.uniform1f(U.uSp,o.sp||0);gl.uniform1f(U.uGl,o.gl||30);
gl.uniform1f(U.uAl,o.al===undefined?1:o.al);gl.uniform1f(U.uRim,o.rim||0);
gl.uniform1f(U.uPw,o.pw||2);gl.uniform1f(U.uTm,o.tm||0);gl.uniform2f(U.uSh,o.sh?o.sh[0]:0,o.sh?o.sh[1]:0);
gl.drawArrays(gl.TRIANGLES,0,m.n);}
const sph=(()=>{const v=[],LA=18,LO=32,P=(i,j)=>{const a=i/LA*Math.PI,b=j/LO*6.28318;return[Math.sin(a)*Math.cos(b),Math.cos(a),Math.sin(a)*Math.sin(b)];};
for(let i=0;i<LA;i++)for(let j=0;j<LO;j++){const a=P(i,j),b=P(i,j+1),c=P(i+1,j+1),d=P(i+1,j);quad(v,a,d,c,b,a);}
return mesh(v);})();
/* ---------- butter field ---------- */
const th=new Float32Array(N*N),mask=new Uint8Array(N*N),tb=new Uint8Array(N*N);let cnt=0;
for(let y=0;y<N;y++)for(let x=0;x<N;x++){const dx=x+.5-N/2,dy=y+.5-N/2;if(dx*dx+dy*dy<=N*N/4){mask[y*N+x]=1;cnt++;}}
const SC=1/(4*M0/cnt); /* a perfectly even layer = 25% texture value = ratio 1.0 in the colour ramp */
const tex=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
[[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]].forEach(p=>gl.texParameteri(gl.TEXTURE_2D,p[0],p[1]));
function upTex(){for(let i=0;i<N*N;i++)tb[i]=mask[i]?Math.min(255,th[i]*SC*255):0;
gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.LUMINANCE,N,N,0,gl.LUMINANCE,gl.UNSIGNED_BYTE,tb);}
function melt(){const k=.03,nw=th.slice();
for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x;if(!mask[i])continue;
if(x<N-1&&mask[i+1]){const f=k*(th[i]-th[i+1]);nw[i]-=f;nw[i+1]+=f;}
if(y<N-1&&mask[i+N]){const f=k*(th[i]-th[i+N]);nw[i]-=f;nw[i+N]+=f;}}
th.set(nw);}
function deposit(dm){const k=N/(2*R),gx=(px+R)*k,gy=(pz+R)*k,rg=(.28+.3*Math.cbrt(rem/M0))*k;
const x0=Math.max(0,Math.floor(gx-rg)),x1=Math.min(N-1,Math.ceil(gx+rg)),y0=Math.max(0,Math.floor(gy-rg)),y1=Math.min(N-1,Math.ceil(gy+rg));
let sw=0;
for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){if(!mask[y*N+x])continue;const d=Math.hypot(x+.5-gx,y+.5-gy);if(d<rg)sw+=1-d/rg;}
if(sw<1e-6)return false;
for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){if(!mask[y*N+x])continue;const d=Math.hypot(x+.5-gx,y+.5-gy);if(d<rg)th[y*N+x]+=dm*(1-d/rg)/sw;}
return true;}
function smooth(){let s=0,s2=0;for(let i=0;i<N*N;i++)if(mask[i]){s+=th[i];s2+=th[i]*th[i];}
const m=s/cnt;if(m<1e-6)return 0;const cv2=Math.sqrt(Math.max(0,s2/cnt-m*m))/m;return Math.exp(-2.2*Math.max(0,cv2-.03));}
const useF=()=>Math.min(1,(M0-rem-burnt)/M0/.7);
function score(){return Math.max(1,Math.min(100,Math.round(100*useF()*smooth())));}
/* ---------- math / camera ---------- */
function mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;}
const nrm=v=>{const l=Math.hypot(...v);return v.map(x=>x/l);};
const crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
let W=1,H=1,eye=[0,8,8],xc=[1,0,0],yc=[0,1,0],zc=[0,0,1],asp=1;
function camera(t){asp=W/H;const por=asp<1,dist=Math.max(10,4.4/(T*asp)),tg=por?[0,.2,.9]:[0,.7,.2],d=nrm(por?[0,.8,.6]:[0,.64,.77]);
eye=[Math.sin(t*.25)*.5,tg[1]+d[1]*dist,tg[2]+d[2]*dist];
zc=nrm([eye[0]-tg[0],eye[1]-tg[1],eye[2]-tg[2]]);xc=nrm(crs([0,1,0],zc));yc=crs(zc,xc);
const V=[xc[0],yc[0],zc[0],0,xc[1],yc[1],zc[1],0,xc[2],yc[2],zc[2],0,-dot(xc,eye),-dot(yc,eye),-dot(zc,eye),1];
const f=1/T,n=.1,fa=100;
const P=[f/asp,0,0,0,0,f,0,0,0,0,(fa+n)/(n-fa),-1,0,0,2*fa*n/(n-fa),0];
return mul(P,V);}
/* ---------- audio (all synthesized, no files) ---------- */
let ac,mg,mus,sizG,sizF,sldG,nb,step=0,nextT=0,muted=false;
const CH=[[174.6,220,261.6,329.6],[164.8,196,246.9,293.7],[146.8,174.6,220,261.6],[130.8,164.8,196,246.9]],MEL=[523.25,587.33,659.25,783.99,880];
function tone(f,t,d,type,v,dst){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);
o.connect(g);g.connect(dst);o.start(t);o.stop(t+d+.05);}
function hat(t,v){const s=ac.createBufferSource();s.buffer=nb;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=7000;
const g=ac.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);
s.connect(f);f.connect(g);g.connect(mus);s.start(t,Math.random(),.08);}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);
g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g);g.connect(mus);o.start(t);o.stop(t+.3);}
function sched(){while(nextT<ac.currentTime+.35){const s=step%32,ci=s>>3,t=nextT;
if(s%8===0)CH[ci].forEach(f=>tone(f,t,3.2,'triangle',.07,mus));
if(s%4===0)kick(t);
if(s%2===1)hat(t,.05);
if(Math.random()<.4)tone(MEL[Math.random()*5|0],t,.9,'sine',.05,mus);
step++;nextT+=.375;}}
/* melting sounds: crackle grains, butter bubbles, hot-spot hiss */
function crk(v,f){const t=ac.currentTime,s=ac.createBufferSource();s.buffer=nb;const b=ac.createBiquadFilter();b.type='bandpass';b.frequency.value=f;b.Q.value=2;
const g=ac.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.03+Math.random()*.03);s.connect(b);b.connect(g);g.connect(mg);s.start(t,Math.random()*1.5,.1);}
function blub(v,f){const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*2.4,t+.07);
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.14);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.18);}
function hiss(){const t=ac.currentTime,s=ac.createBufferSource();s.buffer=nb;const f=ac.createBiquadFilter();f.type='highpass';
f.frequency.setValueAtTime(2500,t);f.frequency.exponentialRampToValueAtTime(9000,t+.5);
const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+.55);
s.connect(f);f.connect(g);g.connect(mg);s.start(t,Math.random(),.7);
const o=ac.createOscillator(),og=ac.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(45,t+.3);
og.gain.setValueAtTime(.3,t);og.gain.exponentialRampToValueAtTime(.0001,t+.35);o.connect(og);og.connect(mg);o.start(t);o.stop(t+.4);}
function initAudio(){if(ac)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
ac=new C();mg=ac.createGain();mg.gain.value=muted?0:.55;mg.connect(ac.destination);
nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
mus=ac.createGain();mus.gain.value=.5;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;mus.connect(lp);lp.connect(mg);
const dl=ac.createDelay();dl.delayTime.value=.375;const fb=ac.createGain();fb.gain.value=.3;lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(mg);
const s=ac.createBufferSource();s.buffer=nb;s.loop=true;sizF=ac.createBiquadFilter();sizF.type='bandpass';sizF.frequency.value=4000;sizF.Q.value=.5;
sizG=ac.createGain();sizG.gain.value=0;s.connect(sizF);sizF.connect(sizG);sizG.connect(mg);s.start();
const s2=ac.createBufferSource();s2.buffer=nb;s2.loop=true;const lf=ac.createBiquadFilter();lf.type='lowpass';lf.frequency.value=650;
sldG=ac.createGain();sldG.gain.value=0;s2.connect(lf);lf.connect(sldG);sldG.connect(mg);s2.start(0,.7);
nextT=ac.currentTime+.1;setInterval(sched,100);}

/* ---------- game ---------- */
let MOB=MOB0,TT=0,state='menu',px=-1.8,pz=0,tx=px,tz=pz,vx=0,vz=0,rem=M0,burnt=0,tl=GAME,sn=0,snv=0,snP=0,lastSec=GAME,acc=0,hz=0,hzP=0,mel=.12,wob=0,wobV=0,hcd=0,jid=-1,jx0=0,jy0=0,jv=[0,0],Z=[],PA=[];

/* hot spots: slowly drifting circles; butter melts up to 6x faster inside and 40% of it burns away */
function mkZones(){Z=[];for(let k=0;k<3;k++){let z,ok,n=0;do{const a=Math.random()*6.283,rr=Math.random()*1.7+.4;

function update(dt){
